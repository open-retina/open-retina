# Core and data
hidden_channels: [64, 64, 64]
in_shape: ??? # Required at top-level config
n_neurons_dict: ??? # Set dynamically (e.g., in training script after loading sessions)

core:
  _target_: openretina.modules.core.base_core.SimpleCoreWrapper
  _convert_: object
  temporal_kernel_sizes: [11, 5, 5]
  spatial_kernel_sizes: [11, 5, 5]
  gamma_input: 10 # gamma_input_spatial in the reference (spatial Laplace on the first layer)
  gamma_temporal: 0.01 # gamma_input_temporal in the reference (temporal smoothness)
  gamma_in_sparse: 0.0
  gamma_hidden: 0.0
  input_padding: false
  hidden_padding: false # no padding on any layer, matching the reference's "padding=False" (see plan doc)
  maxpool_every_n_layers: null
  downsample_input_kernel_size: null
  convolution_type: "custom_separable"
  dropout_rate: 0.0
  cut_first_n_frames: 0
  channels: ??? # set dynamically based on input channels

readout:
  _target_: openretina.modules.readout.multi_readout.MultiSampledGaussianReadout
  _convert_: object
  in_shape: ???
  bias: true
  gamma: 1.0
  init_mu_range: 0.1
  init_sigma_range: 0.3
  reg_avg: False
  batch_sample: True
  align_corners: True
  gauss_type: "full"
  grid_mean_predictor: null # decision 1: no cortex coordinates, plain learned per-neuron means
  shared_features: null
  init_grid: null
  shared_grid: null

shifter:
  _target_: openretina.modules.shifters.mlp_shifter.MultiSessionMLPShifter
  _convert_: object
  input_channels: 2
  hidden_channels: 5
  n_layers: 3
  gamma_shifter: 0.0

# training
learning_rate: 0.005
optimizer: ${optimizer} # References the optimizer from defaults
lr_scheduler: ${lr_scheduler} # References the scheduler from defaults
