# Residual depthwise core with one causal temporal-attention block
# (openretina.modules.core.residual_attention_core.ResidualAttentionCore) and the stock Gaussian-mask readout.
# Train it with long chunks (see hoefling_2024_core_readout_low_res_residual_attention.yaml).
hidden_channels: [16] # stem width; the blocks and attention keep this width
in_shape: ??? # Required at top-level config
n_neurons_dict: ??? # Set dynamically (e.g., in training script after loading sessions)

core:
  _target_: openretina.modules.core.residual_attention_core.ResidualAttentionCore
  _convert_: object
  # stem: the stock first layer
  gamma_input: 0.0
  gamma_hidden: 0.0
  gamma_in_sparse: 0.0
  gamma_temporal: 40.0
  input_padding: 0
  convolution_type: custom_separable
  temporal_kernel_sizes: [21]
  spatial_kernel_sizes: [11]
  cut_first_n_frames: 0
  dropout_rate: 0.0
  maxpool_every_n_layers: null
  downsample_input_kernel_size: null
  color_squashing_weights: null
  # inverted residual depthwise blocks: 2 valid temporal convs of 6 crop 10 frames -> 30 frames in total, as stock
  n_blocks: 2
  block_expansion: 4
  block_spatial_kernel: 5
  block_temporal_kernel: 6
  # causal temporal self-attention
  attn_blocks: 1
  attn_heads: 2
  attn_window: 256 # frames each frame may attend to (8.5 s at 30 Hz); larger windows did not help on Höfling
  attn_mlp_ratio: 4
  attn_ls_init: 0.1
  attn_dropout: 0.0
  channels: ??? # set dynamically based on input channels

readout:
  _target_: openretina.modules.readout.multi_readout.MultiGaussianMaskReadout
  _convert_: object
  in_shape: ???
  scale: true
  bias: true
  gaussian_mean_scale: 6.0
  gaussian_var_scale: 4.0
  positive: true
  mask_l1_reg: 1.0
  feature_weights_l1_reg: 1.0
  readout_reg_avg: false

# training
learning_rate: 0.01
optimizer: ${optimizer} # References the optimizer from defaults
lr_scheduler: ${lr_scheduler} # References the scheduler from defaults
