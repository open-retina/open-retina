defaults:
  - data_io: sridhar_nm_2025
  - quality_checks: null
  - dataloader: sridhar_nm_2025
  - model: core_gaussian_readout
  - optimizer: adamw
  - lr_scheduler: one_cycle_lr
  - training_callbacks:
      - early_stopping
      - lr_monitor
      - model_checkpoint
  - logger:
      - csv
  - trainer: default_deterministic
  - hydra: default
  - _self_ # values in this config will overwrite the defaults

exp_name: vystrcilova_2024_nm_core_readout
seed: 42
check_stimuli_responses_match: false

dataloader:
  batch_size: 16

model:
  in_shape:
    - ${data_io.input_channels}
    - ${data_io.time_bins}
    - ${data_io.stimulus_height}
    - ${data_io.stimulus_width}
  hidden_channels: [64, 64, 64]
  learning_rate: 0.005
  core:
    temporal_kernel_sizes: [15, 11, 7]
    spatial_kernel_sizes: [21, 15, 11]
    gamma_input: 0.4697500757926789
    gamma_in_sparse: 0.2989540104057545
    gamma_hidden: 0.44741472694032014
    gamma_temporal: 92.19523607880937
    input_padding: false
    hidden_padding: [0, 0, 0]
    maxpool_every_n_layers: null
    downsample_input_kernel_size: null
    convolution_type: "custom_separable"
    dropout_rate: 0.03097237571817182
    cut_first_n_frames: 0
  readout:
    bias: true
    gamma: 0.23618371929818793
    init_mu_range: 0.07035228000974214
    init_sigma_range: 0.19639864884346897
    reg_avg: false
    batch_sample: true
    align_corners: true
    gauss_type: "full"
    grid_mean_predictor: null
    shared_features: null
    init_grid: null
    shared_grid: null

paths:
  load_model_path: null
  cache_dir: ${oc.env:OPENRETINA_CACHE_DIRECTORY} # Remote files are downloaded to this location
  data_dir: "https://huggingface.co/datasets/open-retina/open-retina/tree/main/gollisch_lab/sridhar_2025/marmoset/natural_movie"
  log_dir: "./logs/cnn_nm" # Used as parent for output_dir. Will store train logs.
  output_dir: ${hydra:runtime.output_dir} # Modify subpaths in the "hydra/default.yaml" config

matmul_precision:
  _target_: torch.set_float32_matmul_precision
  precision: highest

trainer:
  max_epochs: 15
  accumulate_grad_batches: 1
  gradient_clip_val: 1

only_train_readout: false # whether or not to freeze core parameters and only train readout (eg. when finetuning model to new data)
