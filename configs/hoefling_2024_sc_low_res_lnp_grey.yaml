# Multi-cell Spatial Contrast (SC) model on hoefling_2024, with filters from a greyscale LNP.
#
# The SC model needs a spatial and a temporal filter per cell. This dataset has no white-noise STAs, so the
# filters come from a trained greyscale LNP, saved as STA files with
#   openretina.utils.sta_processing.export_lnp_filters_as_stas(model, output_dir)
# and passed in as paths.sta_dir. Both the lag-0 LNP (one frame) and the separable LNP (10 frames) work.
#
# Variants via overrides:
#   model.learn_contrast_weight=false   LN baseline: w fixed at 0, same filters and nonlinearity
#   model.learn_filters=true            also learn the spatial Gaussians and temporal filters
#   model.temporal_filter_length=10     with learn_filters: learn 10-frame filters from 1-frame STAs
defaults:
  - data_io: hoefling_2024
  - quality_checks: hoefling_2024
  - dataloader: hoefling_2024
  - model: spatial_contrast_core_readout
  - optimizer: adamw
  - lr_scheduler: reduce_lr_on_plateau
  - training_callbacks:
      - early_stopping
      - lr_monitor
      - model_checkpoint
  - logger:
      - tensorboard
      - csv
  - trainer: default_deterministic
  - hydra: default
  - _self_ # values in this config will overwrite the defaults

exp_name: hoefling_2024_sc_low_res_lnp_grey
seed: 42
check_stimuli_responses_match: false

dataloader:
  batch_size: 128

model:
  in_shape: [2, 150, 18, 16] # the stimulus, still green + UV
  # Must equal the weights the LNP was trained with; checked against export_info.json in sta_dir
  color_squashing_weights: [0.5, 0.5]
  sta_dir: ${paths.sta_dir}
  sta_file_pattern: "{retina_index}_roi{cell_index}.npy"
  cell_id_key: roi_ids
  # The LNP filters were learned on the dataloader's stimulus, after its left-eye flip: same coordinates
  flip_sta: false
  temporal_crop_frames: null
  sigma_contour: 1.5
  # Cut 30 frames in total whatever the filter length, as the LNPs and the CNN core-readout do
  target_model_cut_frames: 30
  # Responses are std-scaled inferred spikes with a mean around 1-2. Each neuron starts at its own mean rate:
  # its parameters get only ~2 updates per epoch (2 training batches per session), too few to calibrate from a
  # shared start before early stopping.
  a_init: 1.0
  b_init: 1.0
  init_offset_from_mean_activity: true
  # Only used with learn_filters=true: at the nonlinearity's rate (0.01) the temporal filters get noisy early on
  filter_learning_rate: 1e-3
  # With 4 (or, with learned filters, ~20) parameters per neuron, overfitting is not the risk; stopping before the
  # nonlinearity is calibrated is. So select and schedule on the training objective, the validation Poisson loss.
  scheduler_metric: poisson

training_callbacks:
  early_stopping:
    monitor: val_loss
    mode: min
    min_delta: 0.0
  model_checkpoint:
    monitor: val_loss
    mode: min
    filename: "{epoch:02d}_{val_loss:.6f}_{val_evaluation_loss:.3f}"

paths:
  sta_dir: ??? # Directory written by export_lnp_filters_as_stas
  load_model_path: null
  cache_dir: ${oc.env:OPENRETINA_CACHE_DIRECTORY} # Remote files are downloaded to this location
  data_dir: ${paths.cache_dir}/data/ # Folder where local files are read from.
  log_dir: "." # Used as parent for output_dir. Will store train logs.
  output_dir: ${hydra:runtime.output_dir} # Modify subpaths in the "hydra/default.yaml" config
  movies_path: "https://huggingface.co/datasets/open-retina/open-retina/blob/main/euler_lab/hoefling_2024/stimuli/rgc_natstim_18x16_joint_normalized_2024-01-11.zip"
  responses_path: "https://huggingface.co/datasets/open-retina/open-retina/resolve/main/euler_lab/hoefling_2024/responses/rgc_natstim_2024-08-14.zip"

matmul_precision:
  _target_: torch.set_float32_matmul_precision
  precision: highest

trainer:
  max_epochs: 100
  accumulate_grad_batches: 1
  gradient_clip_val: 1

only_train_readout: false
