# Multi-cell Spatial Contrast (SC) model on the high-resolution hoefling_2024 stimulus (72x64 pixels, 12.5 um each).
#
# The high-resolution counterpart of hoefling_2024_sc_low_res_lnp_grey, for random-init learned filters
# (model.filter_init=random model.learn_filters=true model.temporal_filter_length=31). There are no high-resolution
# STAs, so filter_init=sta needs a paths.sta_dir exported from a high-resolution LNP.
#
# The Gaussian widths are in pixels: a pixel here is 4x smaller than at low resolution, so the initial width of 6 px
# is the low-resolution 1.5 px (75 um) on the retina. sigma_floor (1 px by default) and the filter learning rate,
# which sets how many pixels the Gaussians move per step, are left to the command line.
#
# Variants via overrides: as hoefling_2024_sc_low_res_lnp_grey, e.g. model.learn_contrast_weight=false for the LN model.
defaults:
  - data_io: hoefling_2024
  - quality_checks: hoefling_2024
  - dataloader: hoefling_2024
  - model: spatial_contrast_core_readout
  - optimizer: adamw
  - lr_scheduler: reduce_lr_on_plateau
  - training_callbacks:
      - early_stopping
      - lr_monitor
      - model_checkpoint
  - logger:
      - tensorboard
      - csv
  - trainer: default_deterministic
  - hydra: default
  - model_selection: val_loss
  - _self_ # values in this config will overwrite the defaults

exp_name: hoefling_2024_sc_high_res_lnp_grey
seed: 42
check_stimuli_responses_match: false

dataloader:
  batch_size: 128

model:
  in_shape: [2, 150, 72, 64] # the stimulus, still green + UV
  # Must equal the weights the LNP was trained with; checked against export_info.json in sta_dir
  color_squashing_weights: [0.5, 0.5]
  sta_dir: ${paths.sta_dir}
  sta_file_pattern: "{retina_index}_roi{cell_index}.npy"
  cell_id_key: roi_ids
  # The LNP filters were learned on the dataloader's stimulus, after its left-eye flip: same coordinates
  flip_sta: false
  temporal_crop_frames: null
  sigma_contour: 1.5
  gaussian_init_sigma: 6.0 # 75 um, the low-resolution 1.5 px
  # Cut 30 frames in total whatever the filter length, as the LNPs and the CNN core-readout do
  target_model_cut_frames: 30
  # Responses are std-scaled inferred spikes with a mean around 1-2. Each neuron starts at its own mean rate:
  # its parameters get only ~2 updates per epoch (2 training batches per session), too few to calibrate from a
  # shared start before early stopping.
  a_init: 1.0
  b_init: 1.0
  init_offset_from_mean_activity: true
  # Only used with learn_filters=true: at the nonlinearity's rate (0.01) the temporal filters get noisy early on
  filter_learning_rate: 1e-3
  # Set by the model_selection group, together with the early stopping and checkpoint callbacks
  scheduler_metric: ${selection_metric}
  scheduler_warmup_epochs: ${selection_warmup_epochs}

paths:
  sta_dir: null # Directory written by export_lnp_filters_as_stas; required unless model.filter_init=random
  load_model_path: null
  cache_dir: ${oc.env:OPENRETINA_CACHE_DIRECTORY} # Remote files are downloaded to this location
  data_dir: ${paths.cache_dir}/data/ # Folder where local files are read from.
  log_dir: "." # Used as parent for output_dir. Will store train logs.
  output_dir: ${hydra:runtime.output_dir} # Modify subpaths in the "hydra/default.yaml" config
  movies_path: "https://huggingface.co/datasets/open-retina/open-retina/blob/main/euler_lab/hoefling_2024/stimuli/rgc_natstim_72x64_joint_normalized_2024-10-11.zip"
  responses_path: "https://huggingface.co/datasets/open-retina/open-retina/resolve/main/euler_lab/hoefling_2024/responses/rgc_natstim_2024-08-14.zip"

matmul_precision:
  _target_: torch.set_float32_matmul_precision
  precision: highest

trainer:
  max_epochs: 100
  accumulate_grad_batches: 1
  gradient_clip_val: 1

only_train_readout: false
