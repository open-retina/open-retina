# @package _global_
# Select the checkpoint, stop early and decay the learning rate on the validation correlation (val_evaluation_loss),
# the defaults of BaseCoreReadout and of the LNP configs. Correlation is also the reported goodness of fit, so this
# selects on the reported metric, measured on the validation set. Compare with model_selection=val_loss.
#
# lr_scheduler drives UnifiedCoreReadout models (the LNPs); selection_metric drives the Spatial Contrast model,
# which builds its own scheduler with the same settings.
#
# For the first selection_warmup_epochs epochs neither early stopping nor the learning-rate schedule looks at the
# metric, so a transient at the start of training (e.g. a validation loss that first rises while a strong
# regularizer reshapes randomly initialised filters) can neither stop the run nor cut the learning rate. Runs whose
# config lacks selection_warmup_epochs had no warm-up (selection_warmup_epochs=0).
selection_warmup_epochs: 30
selection_metric: correlation

training_callbacks:
  early_stopping:
    _target_: openretina.callbacks.warmup_early_stopping.WarmupEarlyStopping
    warmup_epochs: ${selection_warmup_epochs}
    monitor: val_evaluation_loss
    mode: max
    min_delta: 1.0e-4
  model_checkpoint:
    monitor: val_evaluation_loss
    mode: max
    filename: "{epoch:02d}_{val_evaluation_loss:.3f}_{val_loss:.6f}"

lr_scheduler:
  _target_: openretina.utils.optimizer_utils.WarmupReduceLROnPlateau
  warmup_epochs: ${selection_warmup_epochs}
  monitor: val_evaluation_loss
  mode: max
  threshold: 0.0005
  threshold_mode: abs
