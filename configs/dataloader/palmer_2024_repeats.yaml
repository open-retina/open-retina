_target_: openretina.data_io.palmer_2024.dataloaders.repeats_dataloaders
_convert_: object
batch_size: 8
train_chunk_size: 60
train_chunk_stride: 30 # The core removes 30 context frames, so this covers each remaining target frame once.
clip_length: 1170
num_val_clips: 1
val_clip_indices: [1] # Leave out water; sweep [0], [1], [2], [3] for four-fold leave-one-movie-out validation.
base_data_path: ${data_io.base_data_path}
response_key: ${data_io.responses.response_key}
fr_normalization: ${data_io.responses.fr_normalization}
exclude_initial_frames: ${data_io.exclude_initial_frames}
