# Colour (green + UV), space-time separable LNP on hoefling_2024, with one temporal kernel per colour channel.
#
# The colour LNP of the manuscript's Table 2 (hoefling_2024_core_readout_low_res_lnp.yaml) weighs the current frame
# only. Here each channel's spatial map is followed by its own temporal kernel over the last 31 frames, so the
# model consumes the same 30 frames as the lag-30 greyscale LNP and the CNN core-readout. The filter is
# sum_c temporal[c, t] * spatial[c, h, w]: rank 1 per channel.
#
# Regularised like the lag-30 greyscale LNP (hoefling_2024_core_readout_low_res_lnp_grey_separable.yaml with
# temporal_kernel_size=31, cut_first_n_frames=0): spatial smoothness 3e4, no temporal smoothness, the default L1.
defaults:
  - data_io: hoefling_2024
  - quality_checks: hoefling_2024
  - dataloader: hoefling_2024
  - model: linear_nonlinear_poisson
  - optimizer: adamw
  - lr_scheduler: reduce_lr_on_plateau
  - training_callbacks:
      - early_stopping
      - lr_monitor
      - model_checkpoint
  - logger:
      - tensorboard
      - csv
  - trainer: default_deterministic
  - hydra: default
  - model_selection: val_loss
  - _self_ # values in this config will overwrite the defaults

exp_name: hoefling_2024_core_readout_low_res_filtered_lnp_separable
seed: 42
check_stimuli_responses_match: false

dataloader:
  batch_size: 128

model:
  in_shape: [2, 150, 18, 16]
  core:
    # The 31-frame temporal kernels consume 30 frames, so the core cuts none
    cut_first_n_frames: 0
  readout:
    _target_: openretina.modules.readout.multi_readout.MultipleSeparableLNPReadout
    temporal_kernel_size: 31
    temporal_kernel_per_channel: true
    temporal_init: random
    smooth_weight: 3e4 # spatial smoothness; the shipped default of 1.0 is numerically inert
    smooth_weight_temporal: 0.0

data_io:
  data_info:
    retina_pixel_size_um: 50 # 4x bigger than high res model

paths:
  load_model_path: null
  cache_dir: ${oc.env:OPENRETINA_CACHE_DIRECTORY} # Remote files are downloaded to this location
  data_dir: ${paths.cache_dir}/data/ # Folder where local files are read from.
  log_dir: "." # Used as parent for output_dir. Will store train logs.
  output_dir: ${hydra:runtime.output_dir} # Modify subpaths in the "hydra/default.yaml" config
  movies_path: "https://huggingface.co/datasets/open-retina/open-retina/blob/main/euler_lab/hoefling_2024/stimuli/rgc_natstim_18x16_joint_normalized_2024-01-11.zip"
  responses_path: "https://huggingface.co/datasets/open-retina/open-retina/resolve/main/euler_lab/hoefling_2024/responses/rgc_natstim_2024-08-14.zip"

matmul_precision:
  _target_: torch.set_float32_matmul_precision
  precision: highest

trainer:
  max_epochs: 100
  accumulate_grad_batches: 1
  gradient_clip_val: 1

only_train_readout: false
