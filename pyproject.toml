[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openretina"
version = "1.1.1"
authors = [
    { name = "Federico D'Agostino" },
    { name = "Thomas Zenkel" },
    { name = "Larissa Höfling" },
]
description = "Open source retina model architectures and training setups"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "IPython",
    "jaxtyping",
    "matplotlib",
    "numpy",
    "pandas",
    "standard-imghdr",
    "seaborn",
    "scipy",
    "tenacity",
    "tensorboard",
    "torch",
    "torchaudio",
    "torchvision",
    "einops",
    "lightning>=2.6",
    "wandb",
    "hydra-core",
    "omegaconf",
    "h5py",
    "opencv-python-headless",
    "imageio>=2.36",
    "moviepy>=2.0.0",
    "huggingface_hub>=0.25",
    "jupyter",
    "ipywidgets",
    "mlflow",
]

[project.urls]
Homepage = "https://github.com/open-retina/open-retina"
Issues = "https://github.com/open-retina/open-retina/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.0",
    "pandas-stubs",
    "pytest",
    "types-psutil",
    "types-tqdm",
    "types-PyYAML",
    "types-requests",
    "nbmake",
    "jupyterlab",
]
devmodels = ["neuralpredictors"]
optuna = [ # for hyperparameter tuning
    "hydra-optuna-sweeper",
    # optuna 2.10 + SQLAlchemy 2.0 breaks the RDBStorage schema, and optuna<3 is required by the
    # sweeper. NOTE: this pin is not confined to the extra -- uv resolves one version per package
    # across all extras, so uv.lock holds sqlalchemy 1.4.54 for EVERY install, including plain
    # `uv sync`. mlflow (a core dependency) therefore runs on SQLAlchemy 1.4; that is inside its
    # declared `>=1.4.0,<3` range, so it is supported rather than broken. Isolating the pin would
    # mean declaring the extras conflicting under [tool.uv], which would stop `dev` and `optuna`
    # from being installed together.
    "sqlalchemy>=1.4,<2",
]

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages]
find = { exclude = ["tests"] }

[tool.setuptools.package-data]
"openretina" = ["py.typed", "configs/*.yaml", "configs/**/*.yaml"]

[project.scripts]
openretina = "openretina.cli.openretina_main:main"

[tool.uv]
# prefer the runner's Python (from actions/setup-python or system Python)
python-preference = "system"
package = true


[tool.ruff]
line-length = 120
indent-width = 4
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
lint.select = ["E", "W", "F"]
lint.extend-select = ["I"]
lint.ignore = ["F722"]                                           # F722 prevents false positive for jaxtypes
exclude = ["openretina/legacy/", "tests/paper_openretina_2025/"]


[tool.mypy]
warn_return_any = false
exclude = ["openretina/legacy/", "tests/paper_openretina_2025/"]
[[tool.mypy.overrides]]
module = [
    "neuralpredictors.*",
    "h5py",
    "scipy.*",
    "wandb",
    "seaborn",
    "torchvision.*",
    "moviepy",
    "sklearn.decomposition",
]
ignore_missing_imports = true
